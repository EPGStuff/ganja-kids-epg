name: Update Kids EPG

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source EPG
        run: |
          curl -L --fail --retry 3 \
            -o source.xml.gz \
            "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg6.xml.gz"
          gunzip -f source.xml.gz

      - name: Create Kids-only EPG
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET

          # Exact XMLTV IDs from the source EPG.
          # UK Kids
          # US Kids
          # Canadian Kids
          wanted_ids = {
              # ---------- UK ----------
              "babytv.uk",
              "boomerang.uk",
              "cartoonito.uk",
              "cartoonnetwork.uk",
              "nick.uk",
              "nickjr.uk",
              "nickjrtoo.uk",
              "nicktoons.uk",
              "pop.uk",
              "popmax.uk",
              "skykids.uk",
              "tinypop.uk",

              # ---------- USA ----------
              "BabyFirst.us",
              "BabyTV.us",
              "Boomerang.us",
              "CartoonNetwork.us",
              "DisneyChannel.us",
              "DisneyJunior.us",
              "DisneyXD.us",
              "Freeform.us",
              "MeTVToons.us",
              "NickJr.us",
              "Nickelodeon.us",
              "NickelodeonWest.us",
              "PBSkidsNYC.us",
              "TeenNick.us",

              # Alternative/lowercase IDs present in source
              "babytv.us",
              "boomerang.us",
              "cartoonnetwork.us",
              "cartoonnetworkwest.us",
              "disneychannel.us",
              "disneychannelwest.us",
              "disneyjunior.us",
              "disneyjuniorwest.us",
              "disneywest.us",
              "disneyxd.us",
              "freeform.us",
              "freeformwest.us",
              "metvtoons.us",
              "nickelodeon.us",
              "nickelodeonwest.us",
              "nickjr.us",
              "nicktoons.us",
              "pbskids.us",
              "teennick.us",
              "universalkids.us",

              # ---------- CANADA ----------
              "adultswim.ca",
              "babyfirst.ca",
              "babytv.ca",
              "boomerang.ca",
              "cartoonnetwork.ca",
              "cartoonnetworkcanada.ca",
              "disneychannelcanada.ca",
              "disneyjunior.ca",
              "disneyxd.ca",
              "gametv.ca",
              "nickelodeon.ca",
              "teletoon.ca",
              "treehouse.ca",
              "ytv.ca",
          }

          tree = ET.parse("source.xml")
          root = tree.getroot()

          # Only keep IDs that actually exist in today's source.
          source_ids = {
              channel.get("id")
              for channel in root.findall("channel")
          }

          keep_ids = wanted_ids & source_ids

          print("")
          print("================================")
          print(f"FOUND {len(keep_ids)} EXACT KIDS XMLTV IDs")
          print("================================")

          for channel_id in sorted(keep_ids):
              print(channel_id)

          missing = wanted_ids - source_ids

          if missing:
              print("")
              print("IDs not present in today's source:")
              for channel_id in sorted(missing):
                  print(channel_id)

          # Remove unwanted channel definitions
          for channel in list(root.findall("channel")):
              if channel.get("id") not in keep_ids:
                  root.remove(channel)

          # Remove programmes belonging to unwanted channels
          for programme in list(root.findall("programme")):
              if programme.get("channel") not in keep_ids:
                  root.remove(programme)

          tree.write(
              "epg.xml",
              encoding="UTF-8",
              xml_declaration=True
          )

          print("")
          print("Kids-only epg.xml created successfully.")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "No EPG changes"
          else
            git commit -m "Update Kids EPG"
            git push
          fi
