name: Update Kids EPG

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Strong 8K EPG
        run: |
          curl -L --fail --retry 3 \
            "https://JohnPulse.github.io/iptv-epg/epg-strong8k.xml.gz" \
            -o epg.xml.gz

      - name: Extract EPG
        run: |
          gunzip -f epg.xml.gz
          test -s epg.xml

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update Kids EPG"
          git push
