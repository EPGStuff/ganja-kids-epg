name: Update Kids EPG

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source EPG
        run: |
          curl -L --fail --retry 3 \
            -o source.xml.gz \
            "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg6.xml.gz"
          gunzip -f source.xml.gz

      - name: Create Kids-only EPG
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          import re

          tree = ET.parse("source.xml")
          root = tree.getroot()

          # Only keep Kids channels from the countries used by
          # our Kids / UK Kids / CA Kids groups.
          allowed_countries = {"uk", "us", "ca"}

          wanted_names = [
              "3abn kids network",
              "adult swim",
              "baby first",
              "babyfirst",
              "baby tv",
              "babytv",
              "bluey",
              "boomerang",
              "cartoon network",
              "cartoonito",
              "chu chu tv",
              "chuchu tv",
              "disney channel",
              "disney junior",
              "disney jr",
              "disney xd",
              "freeform",
              "game tv",
              "gametv",
              "ludikids",
              "metv toons",
              "nick",
              "nick jr",
              "nick junior",
              "nick junior too",
              "nicktoons",
              "nick toons",
              "nickelodeon",
              "pbs kids",
              "pop",
              "pop max",
              "sky kids",
              "teen nick",
              "teennick",
              "teletoon",
              "tiny pop",
              "treehouse",
              "universal kids",
              "ytv"
          ]

          def clean(text):
              text = (text or "").lower()
              text = text.replace("&", "and")
              text = re.sub(r"[^a-z0-9]+", " ", text)
              return " ".join(text.split())

          def country_from_id(channel_id):
              channel_id = (channel_id or "").lower()
              parts = channel_id.rsplit(".", 1)

              if len(parts) == 2:
                  return parts[1]

              return ""

          keep_ids = set()

          for channel in root.findall("channel"):
              channel_id = channel.get("id", "")
              country = country_from_id(channel_id)

              # Reject other countries
              if country not in allowed_countries:
                  continue

              names = [
                  clean(n.text)
                  for n in channel.findall("display-name")
                  if n.text
              ]

              matched = False

              for name in names:
                  for wanted in wanted_names:
                      w = clean(wanted)

                      if (
                          name == w
                          or name.startswith(w + " ")
                          or name == w + " hd"
                          or name == w + " fhd"
                      ):
                          matched = True
                          break

                  if matched:
                      break

              if matched:
                  keep_ids.add(channel_id)

          print("")
          print("================================")
          print(f"FOUND {len(keep_ids)} KIDS XMLTV IDs")
          print("================================")

          for channel_id in sorted(keep_ids):
              print(channel_id)

          # Remove unwanted channel definitions
          for channel in list(root.findall("channel")):
              if channel.get("id") not in keep_ids:
                  root.remove(channel)

          # Remove programmes for unwanted channels
          for programme in list(root.findall("programme")):
              if programme.get("channel") not in keep_ids:
                  root.remove(programme)

          tree.write(
              "epg.xml",
              encoding="UTF-8",
              xml_declaration=True
          )

          print("")
          print("Kids-only epg.xml created successfully.")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "No EPG changes"
          else
            git commit -m "Update Kids EPG"
            git push
          fi
